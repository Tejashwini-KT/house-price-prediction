name: "Copilot Setup Steps"

# This workflow configures the environment that GitHub Copilot coding agent
# uses before it starts working on an assigned issue.
# The job MUST be named `copilot-setup-steps` for GitHub to recognize it.

on:
  workflow_dispatch:   # lets you manually run this to test the setup yourself
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check - train model
        run: |
          python src/train.py
